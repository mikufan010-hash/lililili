<script type="module">
import * as THREE from 'three';

// ══════════════════════════════════
//  RENDERER + CAMERA
// ══════════════════════════════════
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0xf2f1ed,1);
Object.assign(renderer.domElement.style,{position:'fixed',inset:'0'});
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,300);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// UI refs
const flashEl   = document.getElementById('flash');
const hintEl    = document.getElementById('hint');
const labelEl   = document.getElementById('label');
const worldName = document.getElementById('worldname');

function showLabel(txt,col='rgba(255,255,255,0.75)'){
  labelEl.textContent=txt; labelEl.style.color=col;
  labelEl.style.opacity='1';
  setTimeout(()=>labelEl.style.opacity='0',3000);
}

// ══════════════════════════════════
//  NOISE / CURL
// ══════════════════════════════════
function hh(n){return(Math.sin(n)*43758.5453)%1;}
function nz(x,y,z){
  const fx=x-Math.floor(x),fy=y-Math.floor(y),fz=z-Math.floor(z);
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy),uz=fz*fz*(3-2*fz);
  const n=Math.floor(x)+Math.floor(y)*57+Math.floor(z)*113;
  return THREE.MathUtils.lerp(
    THREE.MathUtils.lerp(THREE.MathUtils.lerp(hh(n),hh(n+1),ux),THREE.MathUtils.lerp(hh(n+57),hh(n+58),ux),uy),
    THREE.MathUtils.lerp(THREE.MathUtils.lerp(hh(n+113),hh(n+114),ux),THREE.MathUtils.lerp(hh(n+170),hh(n+171),ux),uy),uz);
}
const EE=0.001;
function curl(x,y,z){
  return new THREE.Vector3(
    (nz(x,y+EE,z)-nz(x,y-EE,z)-(nz(x,y,z+EE)-nz(x,y,z-EE)))/(2*EE),
    (nz(x,y,z+EE)-nz(x,y,z-EE)-(nz(x+EE,y,z)-nz(x-EE,y,z)))/(2*EE),
    (nz(x+EE,y,z)-nz(x-EE,y,z)-(nz(x,y+EE,z)-nz(x,y-EE,z)))/(2*EE));
}

// ══════════════════════════════════
//  HELPERS
// ══════════════════════════════════
function lineMesh(pts,ca,cb,op,scene){
  const curve=new THREE.CatmullRomCurve3(pts);
  const cp=curve.getPoints(38);
  const arr=[];
  const a=new THREE.Color(ca),b=new THREE.Color(cb),col=new THREE.Color();
  cp.forEach((_,i)=>{col.lerpColors(a,b,i/(cp.length-1));arr.push(col.r,col.g,col.b);});
  const geo=new THREE.BufferGeometry().setFromPoints(cp);
  geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
  const mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:op});
  const line=new THREE.Line(geo,mat);
  scene.add(line);
  return line;
}

function portal(scene,px,py,pz,col,radius,name,targetWorld){
  const g=new THREE.Group();
  g.position.set(px,py,pz);
  // glowing disc
  const dMat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.9,side:THREE.DoubleSide});
  g.add(new THREE.Mesh(new THREE.CircleGeometry(radius,48),dMat));
  g.add(new THREE.Mesh(new THREE.TorusGeometry(radius,0.03,10,60),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.5})));
  const light=new THREE.PointLight(col,2,20);
  g.add(light);
  const hit=new THREE.Mesh(new THREE.SphereGeometry(radius*1.5,8,8),new THREE.MeshBasicMaterial({visible:false}));
  g.add(hit);
  g.userData={name,targetWorld,light,dMat,hit,isPortal:true,baseY:py,phase:Math.random()*Math.PI*2};
  scene.add(g);
  return g;
}

// organic curl sculpture
function curlSculpt(scene,px,py,pz,seed,ci,co,lineCount=28){
  const g=new THREE.Group();
  g.position.set(px,py,pz);
  const mats=[];
  function addL(pts,ca,cb,op){
    const curve=new THREE.CatmullRomCurve3(pts);
    const cp=curve.getPoints(34);
    const arr=[];
    const a=new THREE.Color(ca),b=new THREE.Color(cb),col=new THREE.Color();
    cp.forEach((_,i)=>{col.lerpColors(a,b,i/(cp.length-1));arr.push(col.r,col.g,col.b);});
    const geo=new THREE.BufferGeometry().setFromPoints(cp);
    geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
    const mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:op});
    g.add(new THREE.Line(geo,mat));
    mats.push(mat);
  }
  for(let l=0;l<lineCount;l++){
    const pts=[],th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    let x=Math.sin(ph)*Math.cos(th)*0.1,y=Math.sin(ph)*Math.sin(th)*0.1,z=Math.cos(ph)*0.1;
    for(let s=0;s<36;s++){
      pts.push(new THREE.Vector3(x,y,z));
      const c=curl(x*1.5+seed,y*1.5+seed*1.3,z*1.5);
      x+=c.x*0.06;y+=c.y*0.06;z+=c.z*0.06;
      const d=Math.sqrt(x*x+y*y+z*z)||0.001;
      x+=x/d*0.007;y+=y/d*0.007;z+=z/d*0.007;
    }
    addL(pts,ci,co,0.45+Math.random()*0.45);
  }
  for(let l=0;l<lineCount;l++){
    const pts=[],th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    let x=Math.sin(ph)*Math.cos(th)*0.05,y=Math.sin(ph)*Math.sin(th)*0.05,z=Math.cos(ph)*0.05;
    let vx=x*4,vy=y*4,vz=z*4;
    for(let s=0;s<48;s++){
      pts.push(new THREE.Vector3(x,y,z));
      const t=s/48,c=curl(x*0.8+seed+10,y*0.8+seed,z*0.8+5);
      vx=vx*0.91+c.x*0.13;vy=vy*0.91+c.y*0.13;vz=vz*0.91+c.z*0.13;
      const d=Math.sqrt(x*x+y*y+z*z)||0.001;
      x+=vx*0.08+(x/d)*t*0.04;y+=vy*0.08+(y/d)*t*0.04;z+=vz*0.08+(z/d)*t*0.04;
    }
    addL(pts,co,ci,0.18+Math.random()*0.15);
  }
  const hit=new THREE.Mesh(new THREE.SphereGeometry(4,6,6),new THREE.MeshBasicMaterial({visible:false}));
  g.add(hit);
  const glow=new THREE.PointLight(ci,0,14);
  g.add(glow);
  g.userData={mats,glow,activated:false,baseY:py,phase:Math.random()*Math.PI*2,hit};
  scene.add(g);
  return g;
}

// ══════════════════════════════════
//  WORLD 0: WHITE ENTRY
// ══════════════════════════════════
const w0 = new THREE.Scene();
w0.background=new THREE.Color(0xf2f1ed);
w0.fog=new THREE.Fog(0xf2f1ed,18,55);
w0.add(new THREE.AmbientLight(0xffffff,1.3));

// black sculptures
[[-11,0,-5,1.1],[ 12,0,-4,3.4],[-8,0,11,6.2],[10,0,12,8.5]].forEach(([px,py,pz,s])=>{
  curlSculpt(w0,px,py,pz,s,0x080808,0x282828,22);
});

// main portal — leads to dark world
const w0Portal=portal(w0,0,2.5,-3,0xffffff,2.2,'enter','w1');

// radiating lines from portal
for(let i=0;i<120;i++){
  const pts=[],a=(i/120)*Math.PI*2+Math.random()*0.15;
  const r1=8+Math.random()*18,wb=(Math.random()-0.5)*0.9,r0=2.3;
  pts.push(new THREE.Vector3(Math.cos(a)*r0,Math.sin(a)*r0,0));
  pts.push(new THREE.Vector3(Math.cos(a+wb*0.4)*(r0+r1*0.3),Math.sin(a+wb*0.3)*(r0+r1*0.3),(Math.random()-0.5)*2));
  pts.push(new THREE.Vector3(Math.cos(a+wb*0.8)*(r0+r1*0.65),Math.sin(a+wb*0.6)*(r0+r1*0.65),(Math.random()-0.5)*4));
  pts.push(new THREE.Vector3(Math.cos(a+wb*1.3)*r1,Math.sin(a+wb*1.1)*r1,(Math.random()-0.5)*6));
  if(Math.random()<0.4){const a2=a+wb*1.3+(Math.random()-0.5)*0.4;pts.push(new THREE.Vector3(Math.cos(a2)*(r1+Math.random()*5),Math.sin(a2)*(r1+Math.random()*5),(Math.random()-0.5)*7));}
  const curve=new THREE.CatmullRomCurve3(pts);
  const cp=curve.getPoints(28);
  const arr=[];
  cp.forEach((_,i)=>{const t=i/(cp.length-1);const v=0.05+t*0.08;arr.push(v,v,v);});
  const geo=new THREE.BufferGeometry().setFromPoints(cp);
  geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
  w0Portal.add(new THREE.Line(geo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.08+Math.random()*0.2})));
}

// ══════════════════════════════════
//  WORLD 1: DARK ORGANIC
// ══════════════════════════════════
const w1 = new THREE.Scene();
w1.background=new THREE.Color(0x000000);
w1.fog=new THREE.FogExp2(0x000000,0.018);
w1.add(new THREE.AmbientLight(0x111133,0.5));

const w1Sculpts=[
  curlSculpt(w1, 0,0, 0, 0.0,0xffffff,0xaaaaff,28),
  curlSculpt(w1,-11,0,-8,2.3,0xffe8cc,0xff4422,24),
  curlSculpt(w1, 12,0,-6,4.7,0xccffee,0x00cc88,24),
  curlSculpt(w1, -8,0,12,7.1,0xffccee,0xcc0077,24),
];
// portal to network world — glowing orange
const w1Portal=portal(w1,12,2,12,0xff8833,1.6,'— network —','w2');
// portal back to white
const w1Back=portal(w1,-12,2,-10,0xffffff,1.2,'— surface —','w0');

// particles
const pGeo1=new THREE.BufferGeometry();
const pA1=new Float32Array(300*3),pC1=new Float32Array(300*3);
for(let i=0;i<300;i++){
  pA1[i*3]=(Math.random()-0.5)*70;pA1[i*3+1]=Math.random()*12-3;pA1[i*3+2]=(Math.random()-0.5)*70;
  const c=new THREE.Color().setHSL(Math.random(),0.2,0.7);
  pC1[i*3]=c.r;pC1[i*3+1]=c.g;pC1[i*3+2]=c.b;
}
pGeo1.setAttribute('position',new THREE.BufferAttribute(pA1,3));
pGeo1.setAttribute('color',new THREE.BufferAttribute(pC1,3));
w1.add(new THREE.Points(pGeo1,new THREE.PointsMaterial({vertexColors:true,size:0.05,transparent:true,opacity:0.25,sizeAttenuation:true})));

// ══════════════════════════════════
//  WORLD 2: NODE NETWORK — starfield
// ══════════════════════════════════
const w2 = new THREE.Scene();
w2.background=new THREE.Color(0x000000);
w2.fog=new THREE.FogExp2(0x010108,0.01);
w2.add(new THREE.AmbientLight(0x111122,0.3));

// generate many nodes at varied heights — from floor to sky
const nodes=[];
const nodePosArr=[];

// hand-placed key nodes
const keyNodes=[
  [0,0,0,0.55,0xffffff,true],   // center bright
  [0,18,0,0.4,0xffffff,false],  // directly above
  [0,-0.5,0,0.3,0xddddff,false],// floor level
];
// scattered nodes
for(let i=0;i<80;i++){
  const a=Math.random()*Math.PI*2;
  const r=3+Math.random()*38;
  const y=(Math.random()-0.2)*35; // bias upward
  const radius=0.05+Math.random()*Math.random()*0.6;
  keyNodes.push([Math.cos(a)*r, y, Math.sin(a)*r, radius, 0xaaaacc, false]);
}

keyNodes.forEach(([nx,ny,nz,r,col,bright])=>{
  const g=new THREE.Group();
  g.position.set(nx,ny,nz);
  // sphere center
  g.add(new THREE.Mesh(new THREE.SphereGeometry(r,12,12),new THREE.MeshBasicMaterial({color:col})));
  // glow
  const pl=new THREE.PointLight(col, bright?4:0.6+Math.random()*1.2, bright?28:6+r*10);
  g.add(pl);
  // rings around node — 1 to 3 rings, random tilts
  const numRings=bright?3:Math.floor(Math.random()*3)+1;
  for(let ri=0;ri<numRings;ri++){
    const ringR=r*(2+ri*1.8)+Math.random()*0.5;
    const tilt=new THREE.Euler(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI*0.5);
    const ringMesh=new THREE.Mesh(
      new THREE.TorusGeometry(ringR,0.012,8,60),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.15+Math.random()*0.35})
    );
    ringMesh.setRotationFromEuler(tilt);
    g.add(ringMesh);
  }
  w2.add(g);
  nodes.push({g,pl,bright,pos:new THREE.Vector3(nx,ny,nz)});
  nodePosArr.push(new THREE.Vector3(nx,ny,nz));
});

// connect nodes — every node connects to its nearest neighbours
for(let i=0;i<nodePosArr.length;i++){
  const a=nodePosArr[i];
  // find 3-6 nearest
  const dists=nodePosArr.map((b,j)=>({j,d:a.distanceTo(b)}))
    .filter(x=>x.j!==i).sort((x,y)=>x.d-y.d);
  const connects=dists.slice(0,3+Math.floor(Math.random()*3));
  connects.forEach(({j,d})=>{
    if(j<=i)return; // avoid duplicate
    const b=nodePosArr[j];
    // 1-3 curved lines per connection
    const numLines=d<12?3:d<22?2:1;
    for(let li=0;li<numLines;li++){
      const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);
      mid.x+=(Math.random()-0.5)*d*0.25;
      mid.y+=(Math.random()-0.5)*d*0.25;
      mid.z+=(Math.random()-0.5)*d*0.25;
      const pts=[a,mid,b];
      const curve=new THREE.CatmullRomCurve3(pts);
      const cp=curve.getPoints(28);
      const arr=[];
      const bright2=0.12+Math.random()*0.45;
      const col1=new THREE.Color(bright2*0.4,bright2*0.45,bright2*0.7);
      const col2=new THREE.Color(bright2*0.8,bright2*0.85,bright2);
      const colM=new THREE.Color();
      cp.forEach((_,k)=>{colM.lerpColors(col1,col2,Math.sin(k/(cp.length-1)*Math.PI));arr.push(colM.r,colM.g,colM.b);});
      const geo=new THREE.BufferGeometry().setFromPoints(cp);
      geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
      w2.add(new THREE.Line(geo,new THREE.LineBasicMaterial({
        vertexColors:true,transparent:true,
        opacity:li===0?0.1+Math.random()*0.2:0.04+Math.random()*0.08
      })));
    }
  });
}

// portal to spiral world
const w2Portal=portal(w2, 0,2,-22, 0xccffcc, 1.6,'— spiral —','w3');
const w2Back  =portal(w2,-22,2, 0, 0xff8833, 1.2,'— organic —','w1');

// ══════════════════════════════════
//  WORLD 3: SPIRAL (image 2)
// ══════════════════════════════════
const w3 = new THREE.Scene();
w3.background=new THREE.Color(0x000000);
w3.fog=new THREE.FogExp2(0x010108,0.012);
w3.add(new THREE.AmbientLight(0x111122,0.3));

// central glow — brighter
const centerLight=new THREE.PointLight(0xffffff,6,35);
centerLight.position.set(0,0,0);
w3.add(centerLight);
const centerLight2=new THREE.PointLight(0xaaaaff,3,20);
centerLight2.position.set(0,0,0);
w3.add(centerLight2);
w3.add(new THREE.Mesh(new THREE.SphereGeometry(0.5,16,16),new THREE.MeshBasicMaterial({color:0xffffff})));

// thick concentric rings — multiple passes at different sizes
for(let ring=1;ring<=12;ring++){
  const r=ring*2.6;
  const segments=80+ring*12;
  // main thick ring
  for(let pass=0;pass<3;pass++){
    const pts=[];
    const tilt=new THREE.Euler(
      Math.PI/2+(ring%3)*0.12+pass*0.04,
      ring*0.22+pass*0.08,
      ring*0.06+pass*0.03
    );
    for(let s=0;s<=segments;s++){
      const a=(s/segments)*Math.PI*2;
      const wobble=0.2*Math.sin(a*5+ring+pass);
      const r2=r+wobble+pass*0.08;
      pts.push(new THREE.Vector3(
        Math.cos(a)*r2,
        Math.sin(a*2)*0.6+wobble*0.4+pass*0.05,
        Math.sin(a)*r2
      ).applyEuler(tilt));
    }
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const bright=Math.max(0,(1-ring/14));
    const v=0.12+bright*0.75;
    const arr=[];
    pts.forEach(()=>arr.push(v,v,v+0.05));
    geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
    // thick lines for inner rings, thin for outer
    const isThick = ring<=4 && pass===0;
    w3.add(new THREE.Line(geo,new THREE.LineBasicMaterial({
      vertexColors:true,transparent:true,
      opacity: isThick ? 0.7+bright*0.3 : 0.15+bright*0.45,
      linewidth: isThick ? 2 : 1 // note: only works in some contexts but set anyway
    })));
  }
}

// more rings — tilted at all angles, denser
for(let ring=13;ring<=22;ring++){
  const r=ring*2.6;
  const segments=90+ring*8;
  for(let pass=0;pass<2;pass++){
    const pts=[];
    const tilt=new THREE.Euler(
      Math.PI/2+(ring%5)*0.18+pass*0.06,
      ring*0.31+pass*0.12,
      ring*0.09+pass*0.04
    );
    for(let s=0;s<=segments;s++){
      const a=(s/segments)*Math.PI*2;
      const wobble=0.15*Math.sin(a*4+ring+pass);
      const r2=r+wobble+pass*0.06;
      pts.push(new THREE.Vector3(
        Math.cos(a)*r2,
        Math.sin(a*1.5)*0.5+wobble*0.3,
        Math.sin(a)*r2
      ).applyEuler(tilt));
    }
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const bright=Math.max(0,0.3-ring/60);
    const v=0.06+bright*0.4;
    const arr=[];
    pts.forEach(()=>arr.push(v,v,v+0.04));
    geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
    w3.add(new THREE.Line(geo,new THREE.LineBasicMaterial({
      vertexColors:true,transparent:true,opacity:0.08+bright*0.3
    })));
  }
}

// extra tilted rings at random orientations — fills sky
for(let i=0;i<40;i++){
  const r=3+Math.random()*22;
  const pts=[];
  const tilt=new THREE.Euler(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
  const segs=60+Math.floor(r*4);
  for(let s=0;s<=segs;s++){
    const a=(s/segs)*Math.PI*2;
    const w=0.12*Math.sin(a*6+i);
    pts.push(new THREE.Vector3(Math.cos(a)*(r+w),Math.sin(a*2)*0.4,Math.sin(a)*(r+w)).applyEuler(tilt));
  }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const v=0.1+Math.random()*0.5;
  const arr=[];
  pts.forEach(()=>arr.push(v,v,v+0.03));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
  w3.add(new THREE.Line(geo,new THREE.LineBasicMaterial({
    vertexColors:true,transparent:true,opacity:0.08+Math.random()*0.35
  })));
}

// dense cross-arcs — many more
for(let i=0;i<160;i++){
  const ring1=Math.floor(Math.random()*10)+1;
  const ring2=ring1+(Math.random()<0.4?1:Math.floor(Math.random()*3)+1);
  const a=Math.random()*Math.PI*2;
  const r1=ring1*2.6, r2=Math.min(ring2,12)*2.6;
  const arcAngle=(Math.random()-0.5)*1.2;
  const pts=[

// organic floor lines using curl noise — all on y=0 plane
for(let l=0;l<1400;l++){
  const pts=[];
  const startA=Math.random()*Math.PI*2;
  const startR=Math.random()*12;
  let x=Math.cos(startA)*startR;
  let z=Math.sin(startA)*startR;
  const seed=Math.random()*10;
  const steps=50+Math.floor(Math.random()*60);
  for(let s=0;s<steps;s++){
    pts.push(new THREE.Vector3(x,0,z));
    const c=curl(x*0.18+seed,0.5,z*0.18+seed*1.3);
    const speed=0.28+Math.random()*0.22;
    x+=c.x*speed; z+=c.z*speed;
    const d=Math.sqrt(x*x+z*z)||0.001;
    x+=x/d*0.03; z+=z/d*0.03;
    if(d>60)break;
  }
  if(pts.length<4)continue;
  const curve=new THREE.CatmullRomCurve3(pts);
  const cp=curve.getPoints(Math.min(pts.length*2,120));
  const arr=[];
  const isMain=l%8===0;
  const bright=isMain?0.7+Math.random()*0.3:0.12+Math.random()*0.28;
  cp.forEach((_,k)=>{
    const t=k/cp.length;
    const v=bright*(1-t*0.55);

  const geo=new THREE.BufferGeometry().setFromPoints(cp);
  geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));

// simple fbm for floor rings
function fbm2(x,z,oct=4){
  let v=0,a=0.5;
  for(let i=0;i<oct;i++){v+=a*nz(x,0.5,z);a*=0.5;x*=2.1;z*=2.1;}
  return v;
}

function setWorld(key){
  const w=worlds[key];
  camera.position.set(...w.startPos);
  yaw=0; pitch=0; vel.set(0,0,0);
  renderer.setClearColor(w.bg,1);
  currentWorld=key;
  worldName.textContent=w.name;
  worldName.style.color=w.dark?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.12)';
  hintEl.style.color=w.dark?'rgba(255,255,255,0.18)':'rgba(0,0,0,0.2)';

    e.style.background=w.dark?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.3)');

function doTransition(targetKey){
  if(transitioning)return;
  transitioning=true;
  flashEl.style.transition='opacity 0.35s';
  flashEl.style.opacity='1';
  setTimeout(()=>{
    setWorld(targetKey);
    flashEl.style.transition='opacity 1.2s';
    flashEl.style.opacity='0';
    setTimeout(()=>transitioning=false,1300);
  },370);
}

// ── CONTROLS ──
let yaw=0,pitch=0,isDragging=false,lx=0,ly=0;
const keys={};
document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',  e=>keys[e.code]=false);

renderer.domElement.addEventListener('mousedown',e=>{isDragging=true;lx=e.clientX;ly=e.clientY;});
document.addEventListener('mouseup',()=>isDragging=false);
document.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  yaw-=(e.clientX-lx)*0.003; pitch-=(e.clientY-ly)*0.003;
  pitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,pitch));
  lx=e.clientX;ly=e.clientY;
});

// click to activate sculpture or portal
const ray=new THREE.Raycaster(),ctr=new THREE.Vector2(0,0);
document.addEventListener('click',()=>{
  if(transitioning)return;
  const w=worlds[currentWorld];
  ray.setFromCamera(ctr,camera);
  // check portals
  for(const p of w.portals){
    if(ray.intersectObject(p.userData.hit).length){
      doTransition(p.userData.targetWorld);
      return;
    }
  }
  // check sculptures in w1
  if(currentWorld==='w1'){
    const hits=ray.intersectObjects(w1Sculpts.map(s=>s.userData.hit));
    if(hits.length){
      const s=w1Sculpts.find(s=>s.userData.hit===hits[0].object);
      if(s){
        const ud=s.userData;
        ud.activated=!ud.activated;
        if(ud.activated){
          showLabel(ud.name||'');
          ud.glow.intensity=3;
          ud.mats.forEach(m=>m.opacity=Math.min(m.opacity*1.8,1));
        } else {
          ud.glow.intensity=0;
          ud.mats.forEach(m=>m.opacity=0.4+Math.random()*0.4);
        }
      }
    }
  }
});

// ── PROXIMITY CHECK ──
function checkProximity(){
  if(transitioning)return;
  const w=worlds[currentWorld];
  for(const p of w.portals){
    const pp=p.position;
    const dx=camera.position.x-pp.x, dz=camera.position.z-pp.z;
    if(Math.sqrt(dx*dx+dz*dz)<2.8){ doTransition(p.userData.targetWorld); return; }
  }
  if(currentWorld==='w3'){
    const dx=camera.position.x, dz=camera.position.z;
    if(Math.sqrt(dx*dx+dz*dz)<2.2){ doTransition('w4'); return; }
  }
  if(currentWorld==='w4'){
    const dx=camera.position.x, dz=camera.position.z;
    if(Math.sqrt(dx*dx+dz*dz)>50){ doTransition('w2'); return; }
  }
}

// ── LOOP ──
const clock=new THREE.Clock();
const euler=new THREE.Euler(0,0,0,'YXZ');
const vel=new THREE.Vector3(),dir=new THREE.Vector3();

// init
setWorld('w0');
hintEl.style.opacity='1';
setTimeout(()=>hintEl.style.opacity='0',7000);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;

  euler.set(pitch,yaw,0,'YXZ');
  camera.quaternion.setFromEuler(euler);

  dir.set(0,0,0);
  if(keys['KeyW']||keys['ArrowUp'])   dir.z-=1;
  if(keys['KeyS']||keys['ArrowDown']) dir.z+=1;
  if(keys['KeyA']||keys['ArrowLeft']) dir.x-=1;
  if(keys['KeyD']||keys['ArrowRight'])dir.x+=1;
  if(dir.length()>0)dir.normalize().applyQuaternion(camera.quaternion);
  dir.y=0;
  vel.lerp(dir.multiplyScalar(6),0.1);
  camera.position.addScaledVector(vel,dt);
  camera.position.y=1.7;
  checkProximity();

  // animate portals in current world
  const w=worlds[currentWorld];
  for(const p of w.portals){
    const ud=p.userData;
    p.position.y=ud.baseY+Math.sin(t*1.4+ud.phase)*0.18;
    p.scale.setScalar(0.94+Math.sin(t*1.8+ud.phase)*0.055);
    ud.light.intensity=1.8+Math.sin(t*2.2+ud.phase)*0.6;
    p.rotation.z=t*0.025;
  }

  // w0 portal special
  if(currentWorld==='w0'){
    w0Portal.userData.dMat.opacity=0.92+Math.sin(t*1.4)*0.06;
  }

  // w1 sculpts breathe
  if(currentWorld==='w1'){
    w1Sculpts.forEach(s=>{
      s.position.y=s.userData.baseY+Math.sin(t*0.28+s.userData.phase)*0.28;
      s.rotation.y=t*0.05+s.userData.phase;
      if(s.userData.activated){
        s.userData.mats.forEach((m,i)=>m.opacity=0.5+Math.sin(t*3+i*0.5)*0.4);
        s.userData.glow.intensity=2.5+Math.sin(t*4+s.userData.phase)*1;
      }
    });
  }

  // w2 nodes pulse + rings slowly rotate
  if(currentWorld==='w2'){
    nodes.forEach((n,i)=>{
      // brightness pulses at different rates
      n.pl.intensity=(n.bright?3.5:0.8)+Math.sin(t*0.8+i*1.3)*0.6;
      // slow individual rotation
      n.g.rotation.y=t*0.04+i*0.7;
      n.g.rotation.x=Math.sin(t*0.03+i)*0.06;
      // rings inside each node group rotate
      n.g.children.forEach((child,ci)=>{
        if(child.isMesh&&child.geometry.type==='TorusGeometry'){
          child.rotation.z=t*0.05*(ci%2===0?1:-1)+i;
          child.rotation.x=Math.sin(t*0.04+i+ci)*0.3;
        }
      });
    });
    // extra floating rings in w2 gently rotate
    w2.children.forEach((c,i)=>{
      if(c.isLine){
        c.rotation.y=t*0.012*(i%2===0?1:-1);
        c.rotation.z=Math.sin(t*0.008+i*0.5)*0.05;
      }
    });
  }

  // w3 rings rotate + animate fast/slow lines
  if(currentWorld==='w3'){
    centerLight.intensity=3.5+Math.sin(t*2)*0.8;
    centerLight2.intensity=2+Math.sin(t*1.3)*0.6;
    let staticIdx=0;
    w3.children.forEach((c)=>{
      if(c.isLine&&!c.userData.type){
        const dir2=staticIdx%2===0?1:-1;
        const spd=0.008+((staticIdx*7)%10)*0.002;
        c.rotation.y=t*spd*dir2;
        c.rotation.x=Math.sin(t*spd*0.3+staticIdx)*0.04;
        staticIdx++;
      }
    });
    fastLines.forEach(l=>{
      const ud=l.userData;
      const cycle=(t*ud.speed+ud.phase)%(Math.PI*2);
      const prog=cycle/(Math.PI*2);
      l.rotation.y=ud.angle+t*ud.speed*0.15;
      const fadeIn=Math.min(prog*8,1);
      const fadeOut=Math.max(0,1-(prog-0.3)*3);
      l.material.opacity=fadeIn*fadeOut*0.7;
      const sc=0.3+prog*2.5;
      l.scale.set(sc,1,sc);
    });
    slowLines.forEach(l=>{
      const ud=l.userData;
      l.rotation.y=t*ud.speed+ud.phase;
      l.rotation.x=Math.sin(t*ud.speed*0.4+ud.phase)*0.08;
      l.material.opacity=0.35+Math.sin(t*0.5+ud.phase)*0.3;
    });
  }

  // w5 wave world — lines react to camera position
  if(currentWorld==='w5'){
    // camera influence: distance from each line's xOffset drives amplitude boost
    const camX=camera.position.x;
    const camZ=camera.position.z;
    // normalize camZ within wave length for a "position in the wave" factor
    const camProgress=Math.max(0,Math.min(1,(camZ+10)/waveLen));

    waveAnimLines.forEach((wl)=>{
      const steps=100;
      // distance from camera X to this line's X position
      const xDist=Math.abs(camX-wl.xOffset);
      const proximity=Math.max(0,1-xDist/18); // 0→1 as camera gets closer
      const disturbance=proximity*proximity; // squared for sharper falloff

      for(let s=0;s<steps;s++){
        const nt=s/steps;
        const z=nt*waveLen-10;
        // base wave + camera-driven surge near camera Z position
        const camInfluence=Math.exp(-Math.pow(nt-camProgress,2)*12)*disturbance;
        const ampBoost=1+camInfluence*4.5;
        const freqBoost=1+camInfluence*1.8;
        const y=Math.sin(nt*Math.PI*wl.freqA*freqBoost+t*wl.speed+wl.phase)*wl.ampA*ampBoost
               +Math.sin(nt*Math.PI*wl.freqB+t*wl.speed*0.6+wl.phase)*wl.ampB
               +Math.sin(nt*Math.PI*8+t*2+wl.phase)*camInfluence*1.5; // high-freq ripple near cam
        wl.pos[s*3]=wl.xOffset; wl.pos[s*3+1]=y; wl.pos[s*3+2]=z;
        // brightness also reacts — lines near camera glow brighter
        const mid=Math.max(0.05,1-Math.abs(nt-0.5)*1.4);
        const glow=mid+camInfluence*0.8;
        const v=Math.min(1,wl.bright*glow);
        wl.col[s*3]=v; wl.col[s*3+1]=v; wl.col[s*3+2]=v+0.04;
      }
      wl.geo.attributes.position.needsUpdate=true;
      wl.geo.attributes.color.needsUpdate=true;
      // lines close to camera also increase opacity
      const proximityOpacity=0.4+disturbance*0.55;
      wl.line.material.opacity=proximityOpacity;
    });
  }

  // w4 floor world
  if(currentWorld==='w4'){
    floorCenterLight.intensity=2.5+Math.sin(t*2.5)*0.8;
    // fast flicker lines — trail outward and reset
    floorAnimLines.forEach(fl=>{
      const prog=((t*fl.speed+fl.phase)%(Math.PI*2))/(Math.PI*2);
      const headR=prog*62;
      const tailR=Math.max(0,headR-12);
      let x=Math.cos(fl.startA)*tailR, z=Math.sin(fl.startA)*tailR;
      for(let s=0;s<fl.len;s++){
        const c=curl(x*0.18+fl.seed+t*0.08,0.5,z*0.18+fl.seed*1.3);
        x+=c.x*0.3; z+=c.z*0.3;
        const d=Math.sqrt(x*x+z*z)||0.001;
        x+=x/d*(headR-tailR)/fl.len*0.5;
        z+=z/d*(headR-tailR)/fl.len*0.5;
        fl.positions[s*3]=x; fl.positions[s*3+1]=0; fl.positions[s*3+2]=z;
        const fade=1-s/fl.len;
        fl.colors[s*3]=fl.bright*fade; fl.colors[s*3+1]=fl.bright*fade; fl.colors[s*3+2]=fl.bright*fade+0.05;
      }
      fl.geo.attributes.position.needsUpdate=true;
      fl.geo.attributes.color.needsUpdate=true;
      fl.geo.setDrawRange(0,fl.len);
      fl.line.material.opacity=prog<0.95?0.55+fl.bright*0.35:0;
    });
    // slow sweeping bright lines — rotate around center
    floorSlowLines.forEach(l=>{
      l.rotation.y=t*l.userData.speed+l.userData.phase;
      l.material.opacity=0.45+Math.sin(t*1.2+l.userData.phase)*0.25;
    });
  }

  renderer.render(w.scene,camera);
}
animate();
</script>
</body>
